name: Verify legacy HTML parser
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test the CLI on an offline HTML fixture in Python 2.7
        run: |
          docker run --rm --network none -v "$PWD:/source:ro" python:2.7.18-slim-buster sh -eu -c '
            printf "%s" "<p>b2A1</p>" > /tmp/sample.html
            python /source/html_parser.py file:///tmp/sample.html html 3 > /tmp/result
            grep -F "[["A", "1", "b"]]" /tmp/result || python -c "import ast; rows=open("/tmp/result").read().splitlines(); assert ast.literal_eval(rows[1]) == [["A", "1", "b"]]; assert ast.literal_eval(rows[3]) == ["2"]"
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-parser-source
          path: html_parser.py
          if-no-files-found: error
          retention-days: 14
